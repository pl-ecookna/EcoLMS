services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecolms-web.rule=Host(`ecolms-app-u9k5it-eda635-46-173-20-149.traefik.me`)"
      - "traefik.http.routers.ecolms-web.entrypoints=websecure"
      - "traefik.http.routers.ecolms-web.tls=true"
      - "traefik.http.routers.ecolms-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.ecolms-web.loadbalancer.server.port=3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      ECOLMS_API_BASE_URL: "http://api:3001"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      API_PORT: "3001"
      TRANSCRIPTION_SERVICE_URL: "http://transcription-service:3002"
      POSTGRES_URL: "${POSTGRES_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      LLM_PRIMARY_PROVIDER: "${LLM_PRIMARY_PROVIDER:-openai}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-openai/gpt-4.1-mini}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/chat/completions}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-120}"
      MEETING_TRANSCRIPTION_PROVIDER: "${MEETING_TRANSCRIPTION_PROVIDER:-assemblyai}"
      ASSEMBLYAI_API_KEY: "${ASSEMBLYAI_API_KEY:-}"
      ASSEMBLYAI_BASE_URL: "${ASSEMBLYAI_BASE_URL:-https://api.eu.assemblyai.com}"
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  transcription-service:
    build:
      context: .
      dockerfile: docker/transcription-service.Dockerfile
    environment:
      TRANSCRIPTION_PORT: "3002"
      WHISPER_MODEL_SIZE: "${WHISPER_MODEL_SIZE:-small}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
    expose:
      - "3002"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health')\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      API_BASE_URL: "http://api:3001"
      TRANSCRIPTION_SERVICE_URL: "http://transcription-service:3002"
      POSTGRES_URL: "${POSTGRES_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      LLM_PRIMARY_PROVIDER: "${LLM_PRIMARY_PROVIDER:-openai}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1-mini}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-openai/gpt-4.1-mini}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1/chat/completions}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-120}"
      MEETING_TRANSCRIPTION_PROVIDER: "${MEETING_TRANSCRIPTION_PROVIDER:-assemblyai}"
      ASSEMBLYAI_API_KEY: "${ASSEMBLYAI_API_KEY:-}"
      ASSEMBLYAI_BASE_URL: "${ASSEMBLYAI_BASE_URL:-https://api.eu.assemblyai.com}"
      ASSEMBLYAI_SPEECH_MODELS: "${ASSEMBLYAI_SPEECH_MODELS:-universal}"
      ASSEMBLYAI_LANGUAGE_CODE: "${ASSEMBLYAI_LANGUAGE_CODE:-ru}"
      ASSEMBLYAI_POLL_INTERVAL_SECONDS: "${ASSEMBLYAI_POLL_INTERVAL_SECONDS:-5}"
      ASSEMBLYAI_TIMEOUT_SECONDS: "${ASSEMBLYAI_TIMEOUT_SECONDS:-1800}"
      ASSEMBLYAI_AUDIO_URL_EXPIRES_SECONDS: "${ASSEMBLYAI_AUDIO_URL_EXPIRES_SECONDS:-1800}"
      WORKER_JOB_QUEUE_KEY: "${WORKER_JOB_QUEUE_KEY:-ecolms:processing-jobs}"
      WORKER_MEETING_JOB_QUEUE_KEY: "${WORKER_MEETING_JOB_QUEUE_KEY:-ecolms:meeting-jobs}"
      SALUTESPEECH_AUTH_KEY: "${SALUTESPEECH_AUTH_KEY:-}"
      SALUTESPEECH_OAUTH_URL: "${SALUTESPEECH_OAUTH_URL:-}"
      SALUTESPEECH_REST_URL: "${SALUTESPEECH_REST_URL:-https://smartspeech.sber.ru/rest/v1}"
      SALUTESPEECH_UPLOAD_URL: "${SALUTESPEECH_UPLOAD_URL:-https://smartspeech.sber.ru/rest/v1/data:upload}"
      SALUTESPEECH_RECOGNIZE_URL: "${SALUTESPEECH_RECOGNIZE_URL:-https://smartspeech.sber.ru/rest/v1/speech:async_recognize}"
      SALUTESPEECH_TASK_URL: "${SALUTESPEECH_TASK_URL:-https://smartspeech.sber.ru/rest/v1/task:get}"
      SALUTESPEECH_DOWNLOAD_URL: "${SALUTESPEECH_DOWNLOAD_URL:-https://smartspeech.sber.ru/rest/v1/data:download}"
      SALUTESPEECH_SCOPE: "${SALUTESPEECH_SCOPE:-SALUTE_SPEECH_PERS}"
      SALUTESPEECH_MODEL: "${SALUTESPEECH_MODEL:-general}"
      SALUTESPEECH_LANGUAGE: "${SALUTESPEECH_LANGUAGE:-ru-RU}"
      SALUTESPEECH_CA_CERT_PATH: "${SALUTESPEECH_CA_CERT_PATH:-certs/russiantrustedca.pem}"
      SALUTESPEECH_SSL_NO_VERIFY: "${SALUTESPEECH_SSL_NO_VERIFY:-false}"
      SALUTESPEECH_POLL_INTERVAL_SECONDS: "${SALUTESPEECH_POLL_INTERVAL_SECONDS:-5}"
      SALUTESPEECH_TIMEOUT_SECONDS: "${SALUTESPEECH_TIMEOUT_SECONDS:-1800}"
    depends_on:
      api:
        condition: service_healthy
      transcription-service:
        condition: service_healthy
    restart: unless-stopped
