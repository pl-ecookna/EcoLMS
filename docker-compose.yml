services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ecolms-web.rule=Host(`ecolms-app-u9k5it-eda635-46-173-20-149.traefik.me`)"
      - "traefik.http.routers.ecolms-web.entrypoints=websecure"
      - "traefik.http.routers.ecolms-web.tls=true"
      - "traefik.http.routers.ecolms-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.ecolms-web.loadbalancer.server.port=3000"
    environment:
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: "http://api:3001"
      PUBLIC_API_BASE_URL: "http://api:3001"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      API_PORT: "3001"
      TRANSCRIPTION_SERVICE_URL: "http://transcription-service:3002"
      POSTGRES_URL: "${POSTGRES_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  transcription-service:
    build:
      context: .
      dockerfile: docker/transcription-service.Dockerfile
    environment:
      TRANSCRIPTION_PORT: "3002"
    expose:
      - "3002"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3002/health')\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    environment:
      API_BASE_URL: "http://api:3001"
      TRANSCRIPTION_SERVICE_URL: "http://transcription-service:3002"
      POSTGRES_URL: "${POSTGRES_URL:-}"
      REDIS_URL: "${REDIS_URL:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    depends_on:
      api:
        condition: service_healthy
      transcription-service:
        condition: service_healthy
    restart: unless-stopped
